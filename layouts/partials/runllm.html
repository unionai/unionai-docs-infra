{{- if not .Site.Params.show_deprecation_message -}}
<script
  type="module"
  id="runllm-widget-script"
  src="https://widget.runllm.com"
  crossorigin="true"
  version="stable"
  runllm-name="Union"
  runllm-position="BOTTOM_RIGHT"
  runllm-assistant-id="60"
  runllm-brand-logo="{{ "images/ask-ai.svg" | absURL }}"
  runllm-hide-trigger-button="true"
  async
></script>
<script>
document.getElementById('runllm-trigger').addEventListener('click', function() {
  if (window.runllm) window.runllm.open();
});
</script>
{{- end -}}
