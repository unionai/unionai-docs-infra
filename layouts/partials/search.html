{{- $app := site.Params.search.app_id -}}
{{- $key := site.Params.search.search_key -}}
{{- $idx := site.Params.search.index_name -}}

<link rel="preconnect" href="https://{{ $app }}-dsn.algolia.net" crossorigin />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@docsearch/css@3" />

<div id="docsearch" style="display:none;"></div>
<button id="search-trigger" title="Search" class="header-search">
  <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8.5" cy="8.5" r="6"/><line x1="13" y1="13" x2="18" y2="18"/></svg>
  <span class="search-label">Search</span>
  <span class="search-keys"><kbd>&#x2318;</kbd><kbd>K</kbd></span>
</button>

<script src="https://cdn.jsdelivr.net/npm/@docsearch/js@3"></script>
<script>
    const pathParts = window.location.pathname.split('/').filter(Boolean);

    // Expected: ['docs', 'v2', 'union', ...]
    let version = null;
    let variant = null;

    if (pathParts.length >= 3 && pathParts[0] === 'docs') {
        version = pathParts[1];
        variant = pathParts[2];
        console.log(`Search version ${version}, variant ${variant}`)
    }

    docsearch({
        container: '#docsearch',
        appId: '{{ $app }}',
        indexName: '{{ $idx }}',
        apiKey: '{{ $key }}',
        searchParameters: {
        facetFilters: [
            version ? `version:${version}` : '',
            variant ? `variant:${variant}` : ''
        ].filter(Boolean) // remove empty strings
        },
        debug: true
    });

    // Connect custom button to DocSearch modal
    document.getElementById('search-trigger').addEventListener('click', function() {
        var dsBtn = document.querySelector('#docsearch .DocSearch-Button');
        if (dsBtn) dsBtn.click();
    });
</script>
