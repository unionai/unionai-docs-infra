{{- if .AlertType -}}
{{- /* A class given as a block attribute after the alert (`{.large-title}`) lands on
       this wrapper, so CSS can style one callout without touching the rest. */ -}}
<div{{ with .Attributes.class }} class="{{ . }}"{{ end }}>
    <sl-alert open
        {{ if eq .AlertType "note" }}variant="primary"{{ end }}
        {{- if eq .AlertType "warning" -}}variant="warning"{{- end -}}
        {{- if eq .AlertType "caution" -}}variant="danger"{{- end -}}
    >
        <sl-icon slot="icon" name="info-circle"></sl-icon>
        {{- if .AlertTitle -}}
        <strong>{{- .AlertTitle -}}</strong><br />
        {{- end -}}
        {{- .Text -}}
    </sl-alert>
</div>
{{- else -}}
<blockquote>
    {{- .Text -}}
</blockquote>
{{- end -}}
