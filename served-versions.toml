# Cross-line served-versions registry (DOC-1245) — the version SELECTOR's full list.
#
# Each branch's own versions.toml (at its repo root) drives what THAT build assembles
# and cuts. This shared file — read by every build on both branches (it lives in the
# shared unionai-docs-infra submodule) — is the UNION across lines, so the flat selector
# on any page can list every line's entries, even though a given deployment only holds
# its own line's trees (CloudFront routes across lines). Maintain it when either line
# cuts a new version (rotate stable; move the outgoing stable into enumerated).
#
# If this file is absent, the selector falls back to the per-branch versions.toml (this
# line only). Per line:
#   latest      whether the line has a bleeding-edge build (v2 -> /docs/latest; v1 is
#               frozen, so false — no latest served).
#   stable      the newest tag, served ONCE at /docs/<line> (the one indexed URL). Shown
#               as "stable · <n>" on the active line, or just "<n>" on a frozen line.
#   enumerated  the OLDER tags, each served at /docs/<tag>. The newest tag is NEVER here
#               (it's stable, at /docs/<line>) — no byte-identical duplicate tree.

[v2]
latest = true
stable = "v2.5.12.0"
enumerated = []          # older v2 tags, newest-first, once there are any

[v1]
latest = false
stable = "v1.16.23.0"
enumerated = []          # older v1 tags (frozen line — grows only if v1 is ever re-cut)
