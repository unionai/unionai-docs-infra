[params]
# List of available versions. Format: v<major>[.<minor>]
versions = [
  "v2",
  "v1"
]

show_deprecation_message = false

# Set legacy version number
# current_version = "<do-not-set>" # set by build

# Per-line banner (DOC-1572): replaces the sign-up banner at the top of every page of a
# version line -- the stable /docs/<line> and every pinned /docs/<line>.x.y.z -- in both
# variants. Keyed by line ("v1"), which flyte-banner.html takes from current_version's
# first dot-separated segment; a line without an entry (v2, latest, a dev build) keeps
# the sign-up banner. It lives in the infra (chrome), not in the line's content, so it
# reaches every pin at once, through a pointer bump, with no cut. `link_path` is
# resolved against the line's stable tree, /docs/<line>/<variant>/, so a pin links to
# the current page rather than its own snapshot of it.
[params.line_banners.v1]
text = "Flyte 1 reaches end of life on December 31, 2026"
button = "Learn more"
link_path = "community/"
