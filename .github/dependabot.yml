# Keep the GitHub Actions used by .github/workflows/ current, so runtime
# deprecations (e.g. Node 20 -> Node 24) arrive as PRs instead of CI warnings.
#
# All action bumps are grouped into one weekly PR.
#
# Scope: `main` only (Dependabot watches the default branch).

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
